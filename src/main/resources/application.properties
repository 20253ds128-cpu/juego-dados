# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=dice-game
server.port=36666

# ===================================================================
# Database Configuration (MySQL)
# Instructions: Replace 'YOUR_USERNAME', 'YOUR_PASSWORD', '3306' and
# 'juego_dados_db' with your local MySQL credentials.
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/juego_dados_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Options: 'update' (creates/updates tables automatically), 'validate', 'none'
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL queries in the console (Set to false for production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true